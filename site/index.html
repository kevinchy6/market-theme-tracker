<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tape Pulse — Market Theme Tracker</title>
<meta name="description" content="Sub-industry leadership, breadth, gaps, earnings and COT — powered by free Yahoo Finance data, updated by GitHub Actions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f0a832'/%3E%3Cpath d='M6 22l6-8 4 5 6-10 4 4' stroke='%230a0b0d' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="tape"><div class="tape-track" id="tape"></div></div>

<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-label="Tape Pulse logo" fill="none">
      <rect width="32" height="32" rx="7" fill="currentColor" opacity="0.15"/>
      <path d="M6 22l6-8 4 5 6-10 4 4" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Tape Pulse <span class="sub">market theme tracker</span>
  </div>
  <div class="search-wrap">
    <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
    <input id="search" type="text" placeholder="Search ticker…" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <span class="updated" id="updated"></span>
  <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
  </button>
</header>

<nav class="main-nav" id="main-nav">
  <button class="nav-btn active" data-view="themes">Theme Tracker</button>
  <button class="nav-btn" data-view="spotlight">Highs &amp; Lows</button>
  <button class="nav-btn" data-view="breadth">Breadth</button>
  <button class="nav-btn" data-view="scanner">Gap Scanner</button>
  <button class="nav-btn" data-view="earnings">Earnings</button>
  <button class="nav-btn" data-view="cot">COT Data</button>
</nav>

<main id="main"><div class="loading">loading…</div></main>

<footer>
  Data: Yahoo Finance (free, delayed) &amp; CFTC — auto-updated by GitHub Actions ·
  Universe: S&amp;P 1500 · Not investment advice ·
  <a href="https://github.com/kevinchy6/market-theme-tracker" id="repo-link">Source</a>
</footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" style="position:relative" id="modal"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
