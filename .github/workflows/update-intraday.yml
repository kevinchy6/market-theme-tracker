name: Intraday update

on:
  schedule:
    # GitHub free-tier scheduled runs get heavily delayed / dropped
    # (up to 60+ min under high load, often skipped entirely). Fire
    # every 15 min during the US session to guarantee at least one
    # run per hour lands. The concurrency group below prevents overlap.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

# also prevent two intraday runs from stacking up on Yahoo at once
# (they don't add value and just burn rate limit)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data_cache/prices.parquet
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Update prices (incremental)
        run: python -m pipeline.prices auto
        continue-on-error: true

      - name: Compute dashboards
        run: python -m pipeline.compute
        continue-on-error: true

      - name: Save price cache
        uses: actions/cache/save@v4
        with:
          path: data_cache/prices.parquet
          key: prices-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
