name: Weekly full refresh

on:
  schedule:
    - cron: "0 10 * * 6" # Saturday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild universe & industry map
        run: python -m pipeline.universe
        continue-on-error: true

      - name: Full price history download
        run: python -m pipeline.prices full

      - name: Refresh fundamentals
        run: python -m pipeline.fundamentals
        continue-on-error: true

      - name: Full earnings scan
        run: python -m pipeline.earnings weekly
        continue-on-error: true

      - name: Refresh COT
        run: python -m pipeline.cot
        continue-on-error: true

      - name: Compute dashboards
        run: python -m pipeline.compute

      - name: Fetch news for movers
        run: python -m pipeline.news
        continue-on-error: true

      - name: Rebuild deep-dive files with news
        run: python -m pipeline.compute

      - name: Save price cache
        uses: actions/cache/save@v4
        with:
          path: data_cache/prices.parquet
          key: prices-${{ github.run_id }}

      - name: Commit refreshed caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_cache/universe.json data_cache/yahoo_industry_map.json \
                  data_cache/fundamentals.json data_cache/earnings_cache.json \
                  data_cache/news.json || true
          git diff --cached --quiet || git commit -m "chore: weekly cache refresh [skip ci]"
          git push || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
